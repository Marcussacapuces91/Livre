variables:
  model: 'gemma4:cloud'
  docs_path: './docs'

structure:
  title: "La plus Grande Bibliothèque du Monde"
  guidance: |-
    L'idée est de constituer un système d'échange de livres sur abonnement selon le parcours suivant :
    
      1. Le lecteur "commande" un livre sur l'application ;
      2. Il le reçoit dans une enveloppe matelassée dans un 'locker' qu'il va cherché proche de chez lui ;
      3. Il lit le livre...
      4. Il replace le livre dans une enveloppe matelassée (celle initiale ou une autre) ;
         Y appose un QR Code préimprimé ou réutilise celui de l'enveloppe s'il est toujours lisible ;
         Associe le livre (ISBN) et le QR-Code de l'enveloppe ;
         Puis va le reposer dans un locker ou dans une boutique affiliée pour expédition immédiate ;
         Le QR-Code de l'enveloppe permet l'ouverture d'une case vide du locker ou la prise en charge chez l'affilié.
      5. Le livre est expédié au prochain demandeur ou au central en cas de besoin de stockage ou de défaut (livre abimé ou mauvais livre reçu).
    
    Pour augmenter rapidement le volume des titres référencés, on demandera aux premiers abonnés d'inventorier les
    livres qu'ils possèdent et de leur affecter un bonus quand leur livres sont injectés dans le système.


#📌 Recommandations concrètes
#
#  1 MVP ultra‑léger – Utilisez des QR‑codes uniquement (pas d’imprimante). Chaque livre possède déjà son ISBN ; le QR contient l’ID du livret, le code client, la date de retour prévue.
#  2 Choisissez un opérateur de locker déjà existant (ex : InPost, UPS Access Point). Vous ne payez que la location d’un point, pas d’infrastructure.
#  3 Démarrez sur un segment niche – par ex. “romans contemporains français” ou “livres pour enfants”. Un catalogue ciblé donne un premier effet de réseau plus rapide.
#  4 Intégrez un petit “cercle de confiance” dès le lancement (ex : membres recommandés par un ami) → réduction du risque de perte.
#  5 Mettez en place un fonds de remplacement (1 % du chiffre d’affaires) pour couvrir les pertes et garder la confiance des membres.
#  6 Pensez à la durabilité – réutilisez les enveloppes matelassées, offrez un “pack d’emballage” à chaque membre (enveloppe + bande élastique) qui revient à chaque livraison.
#  7 Développez un tableau de bord d’inventaire à la fois interne et visible par les utilisateurs (ex : “10 exemplaires disponibles, 2 en transit”). Cela réduit l’anxiété du lecteur et augmente le taux de
#    conversion.
#  8 Définissez clairement les règles de “réservation” – limite de 2 livres simultanés par membre, délai de 30 jours, renouvellement possible si aucun autre demandeur n’est en attente.
#  9 Testez le modèle de bonus d’inventaire avec un programme “Friend‑Referral” : chaque ami qui inscrit 2 livres rapporte + 1 € de crédit à l’invitant.
# 10 Planifiez une levée de fonds (seed) en présentant le modèle comme “plateforme circulaire pour la culture”. Les fonds serviront à financer le stock initial et la négociation des lockers.
#

