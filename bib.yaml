variables:
#  model: 'gemma4:cloud'
  model: 'gpt-oss:120b-cloud'
  think: high
#  options: {}
  docs_path: './docs'
  substitutions:
    - '$\rightarrow$': '⟶'
    - '---\n': '\n'


structure:
  title: "La plus Grande Bibliothèque du Monde"
  guidance: |-
    # Contexte
    
    L'idée est de constituer un système d'échange de livres sur abonnement selon le parcours suivant :
    
      1. Le lecteur "commande" un livre sur l'application ;
      2. Il le reçoit dans une enveloppe matelassée dans un 'locker' qu'il va cherché proche de chez lui ;
      3. Il lit le livre...
      4. Il imprime une nouvelle étiquette, place le livre (lecture du code-barres) dans l'enveloppe (photo de l'étiquette
         / code à barres) puis va le reposer dans un autre locker ou dans une boutique affiliée pour expédition
         immédiate ;
      5. Le livre est expédié au prochain demandeur ou au central en cas de défaut (livre abimé ou mauvais livre reçu).
    
    Pour augmenter rapidement le volume des titres référencés, on peut proposer aux premiers abonnés d'inventorier les
    livres qu'ils possèdent et de leur affecter un bonus quand leur livres sont injectés dans le système.
    
    # Rédaction
    
    - Tu vas rédiger chaque chapitre ou section à la demande, quand ils te seront indiqués.
    - Respecte le titre et sa numérotation, y compris le niveau d'entête (`#` pour un chapitre, `##` pour une section, etc.)
    - Ne commente pas ta rédaction ; pas de : "maintenant je vais produire un chapitre qui détaille..."
    - Ne justifie pas tes choix dans une partie conclusive, sauf si le prompt en fait la demande expresse.
    - Par contre, tu peux tout à fait expliquer au cours de ta rédaction les éléments de ton raisonnement qui justifie une position ou une décision (raisonnement logique).
    - Ne rédige que ce qui t'es demandé (chapitre ou section).
    
    # Structure
    
    La structure du document est déjà définie comme suit :
    
    {{ structure }}
    
    Référence toi aux autres chapitres/sections quand cela est nécessaire. Tu peux inclure des liens markdown, sachant que chaque chapitre est dans un fichier `chap[n].md`.

  sections:
    - title: "Analyse"
      output_file: "analyse.md"
      guidance: |-
        Ton avis sur ce _business model_. Y vois-tu des faiblesses, que l'on peut renforcer ou qui sont bloquantes ?
        Comment absorber un cout de transport d'entre 2 et 3 € par transport de livre (soit le double pour un livre lu, sauf optimisation entre 2 lecteurs successifs) ?
        
        Enfin propose un chapitrage pour décrire ce projet et sa mise en oeuvre en plusieurs itérations (MVP et iterations suivantes sur 6 mois à un an).

    - title: "Table des matières"
      output_file: "index.md"
      guidance: |-
        Crée une page d'index pour le site GitHub/Jekyll associé qui permet d'accéder aux autres pages de la structure indiquée ci-dessus.
        
        Les liens sont à faire vers des fichiers nommés `chap[n].md`. Par exemple, `chap1.md` correspond au chapitre `1. Introduction et vision`.
        Exceptionnellement, les annexes sont dans le fichier `annexes.md`.
        
        Ajoute une courte introduction avant la table des matières pour présenter le sujet / la thématique car cette page est celle d'aterrissage du site.

    - title: "1. Introduction et vision"
      output_file: "chap1.md"
      prolog: "Rédige une courte introduction à ce chapitre"
      guidance: "Positionner la plateforme comme le premier réseau de prêt physique à l’échelle nationale."
      sections:
        - title: "1.1. Contexte du marché"
        - title: "1.2. Mission & valeurs"
        - title: "1.3 Objectifs à 12 mois"

    - title: "2. Analyse du modèle économique"
      output_file: "chap2.md"
      prolog: "Rédige une courte introduction à ce chapitre"
      guidance: "Décomposer les sources de revenus et les postes de coûts."
      sections:
        - title: "2.1 Revenus (abonnements, frais, partenariats)"
        - title: "2.2 Structure de coûts"
        - title: "2.3 Marges et seuil de rentabilité"

    - title: "3. Étude de faisabilité opérationnelle"
      output_file: "chap3.md"
      guidance: "Identifier les exigences logistiques, légales et technologiques."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "3.1 Logistique (lockers, transport)"
        - title: "3.2 Cadre juridique"
        - title: "3.3 Architecture technique"

    - title: "4. Risques, faiblesses et mitigation"
      output_file: "chap4.md"
      guidance: "Lister les points bloquants et proposer des plans d’atténuation."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "4.1 Risques logistiques"
        - title: "4.2 Risques légaux"
        - title: "4.3 Risques financiers"

    - title: "5. Stratégie d’absorption du coût de transport"
      output_file: "chap5.md"
      guidance: "Détail des leviers tarifaires, de groupage et de partenariat."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "5.1 Optimisation du flux"
        - title: "5.2 Modèle tarifaire"
        - title: "5.3 Partenariats logistiques"
        - title: "5.4 Incentives utilisateurs"

    - title: "6. Roadmap produit – MVP et itérations"
      output_file: "chap6.md"
      guidance: "Définir les jalons de développement sur 6 mois à 1 an."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "6.1 MVP – périmètre minimal"
        - title: "6.2 Itération 1 – extension du réseau de lockers"
        - title: "6.3 Itération 2 – automatisation du tri"
        - title: "6.4 Itération 3 – système de notation & assurance"
        - title: "6.5 Itération 4 – IA de recommandation & optimisation du matching"

    - title: "7. Architecture technique détaillée"
      output_file: "chap7.md"
      guidance: "Schémas d’intégration, API, base de données, sécurité."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "7.1 Front‑end mobile"
        - title: "7.2 Backend & micro‑services"
        - title: "7.3 Interfaces partenaires"
        - title: "7.4 Gestion de la chaîne de suivi (tracking)"

    - title: "8. Plan d’acquisition & rétention"
      output_file: "chap8.md"
      guidance: "Stratégies marketing, communauté, programmes de parrainage."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "8.1 Early‑adopters & inventaire bonus"
        - title: "8.2 Campagnes digitales"
        - title: "8.3 Programme de fidélité"
        - title: "8.4 KPI et tableau de bord"

    - title: "9. Modèle financier prévisionnel"
      output_file: "chap9.md"
      guidance: "Projections de revenus, coûts, cash‑flow et besoins de financement."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "9.1 Scénarios (conservateur / optimiste)"
        - title: "9.2 Analyse de sensibilité"
        - title: "9.3 Plan de levée de fonds"

    - title: "Annexes"
      output_file: "annexes.md"
      guidance: "Documents de support, études de cas, fiches techniques."
      prolog: "Rédige une courte introduction à ce chapitre"
      sections:
        - title: "A.1 Glossaire"
        - title: "A.2 Templates d’étiquettes"
        - title: "A.3 Contrats partenaires"
